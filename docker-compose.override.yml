services:
  postgres:
    ports:
      - "5433:5432"

  api:
    volumes:
      - .:/app
    command: >
      uvicorn api.main:app --host 0.0.0.0 --port 8000
      --reload
      --timeout-graceful-shutdown 3
      --reload-dir /app/api
      --reload-dir /app/db
      --reload-dir /app/enrichment
      --reload-dir /app/collectors
      --reload-dir /app/intelligence
      --reload-dir /app/fine_tuning
      --reload-dir /app/worker

  worker:
    volumes:
      - .:/app
    command: python worker/scheduler.py

  web:
    volumes:
      - ./web/src:/app/src
